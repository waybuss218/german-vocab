.\nBCHUETARTK ARE PR FE.\n请 看 下 面 两 句 话 的 对 比 :\nObwohl man Genkrankheiten einfacher als früher feststellen kann, sind solche Krankheiten noch schwer\nzu behandeln.\n这 句 话 是 我 们 很 容易 接受 的 句子 。 但 是 和 下 句 德 福 风 格 的 内 容 对 比 起 来 就 显得 太 简单 了 。\nObwohl es in Diagnosen und Therapien große Fortschritte gegeben hat, gelten Genkrankheiten\nimmer noch als kaum heilbar.\n\nRKERDERENFTRLESRHT ER, RAN EARERKÄAB AA REN\n\n通过 两 句 话 的 对 比 可 以 发 现 ， 虽然 两 句 话 意思 相同 ， 但 是 德语 的 高 级 表达 中 名 词 化 的 形式 更\n常见 。\n\n3. fest/nehmen (nimmt fest, nahm fest, hat festgenommen) Vt. i£4# die Festnahme\nBeispiel: W2.1\n"},{"pdf_page":3,"printed_page":15,"stage":[1],"source_text":"22 Ai m\n\n前 纵 her- 表示 “来 ， 过 来 ”\n\n1. her/stellen Vt. 生产 ,制造 = produzieren\nder Hersteller, - 生产 商 der Produzent, -en\nBeispiel:\nDie Messebesucher haben die Möglichkeit, einen unmittelbaren Kontakt zu den\nProduzentenfirmen herzustellen.\n博览 会 的 参观 者 有 机 会 直接 接触 生产 公司 。\n\n2. her/nehmen (nimmt her, nahm her, hat hergeommen) Vt. 452], #3] = besorgen\nBeispiel:\nIn manchen Häusern werden moderne Karminöfen zum Heizen der Räume hergenommen.\n\n在 一 些 房屋 中 采用 现代 壁炉 取暖。\n\n前 纵 herunter- 表示 “下 来 ， 弄 下 来 ”\nherunter/laden (lidt herunter, lud herunter, hat heruntergeladen) Vt. 下 载 = downloaden\nBeispiel:\nWer geschützte Arbeiten illegal herunterlädt, stiehlt geistiges Eigentum.\n从 网 络 上 直接 下 载 受 保护 的 论文 的 人 ,窃取 了 精神 财富 。\n\n前 缀 hin- 表示 “向 那里 ， 到 那里 ”\n\nhin/weisen auf A., (wies hin, hat hingewiesen) Vt. 指点 ， 提 示 der Hinweis,-e\nBeispiel:\n\nIch muss Sie darauf hinweisen, dass die Krankenversicherung nur in Deutschland gilt.\n我 作 须 提示 您 ， 医 疗 保险 只 是 在 德国 境内 有 效 。\n\n前 红 mit- 表示 “共同 ， 附 带 ”\n1. mit/teilen Vt. 通知 die Mitteilung, -en\n\n德 福 考 试 中 相关 的 词汇 :\n\ndie Anzeige, -n (住房 ， 招 聘 ) 告示 ， 广 告 das Inserat, - e 报刊 上 的 广告\nder Aushang, .e 广告 ， 通 告 das Plakat, -e 广告 ,海报\nder Prospekt, -e 广告 单 ， 说 明 书\n\nBeispiel:\n\nAuf dem Schwarzbrett steht die Mitteilung, dass der Unterricht am Montag ausfällt.\n\n在 告示 栏 上 有 通知 : 周一 的 课 取消 了 。\n\nZwei  zu beobachten.\n博览 会 的 参展 商 能 够 向 感 兴趣 的 公众 展示 自己 的 产品 ， 开 拓 业 务 机 会 ， 建 立新 的 联系 ，\n"},{"pdf_page":5,"printed_page":17,"stage":[1],"source_text":"22 Hi Ws\n\n识别 潜在 客户 的 需求 ， 同 时 观察 竞争 对 手 的 货品 供给 。\n\n. nach/gehen D. (ging nach, ist nachgegangen) Vi. 深入 研究\nBeispiel:\nEuropas Raumfahrer sollten der Bewegung der Satelliten nachgehen, die die Erde\numkreisen.\n\n欧洲 的 航天 员 要 研究 环绕 地 球 的 卫星 的 运动 情况 。\n\n.nach/holen Vt. 赶 上 人 ， 补 上 Prüfung nachholen 补考\n\n德 福 听 力 题 示例 :\n\nFrage:\n\nWarum braucht der Mann das Semester nicht nachzuholen?\n\nHörtext:\n\nA: Wie ist es eigentlich mit der Anerkennung? Werden mir die Studienleistungen des\nAuslandssemesters anerkannt oder muss ich hier noch Seminare belegen, wenn ich\nzurückkomme?\n\nB: Beim Erasmusprogramm werden alle Studienleistungen anerkannt, sodass Sie kein\n\nSemester verlieren.\n\nLösung: weil Auslandssemester im Rahmen des Erasmusprogramms anerkannt\nwerden.\n\n这 道 题 除了 要 听 懂 内 容 之 外 ， 重 点 是 对 “nach/holen” 的 理解 ， 指 “课程 的 重修 ”，\n理解 了 这 一 点 才能 和 听力 原文 中 的 “Anerkennung ( 承认， 认可) ”联系 上 。 而 “noch\nSeminare belegen” 与 nachholen 之 间 也 是 词汇 转换 关系 。\n\n. nach/lassen (lässt nach, ließ nach, hat nachgelassen) Vi. 减少 der Nachlass, .. e 减 价\n\nnachlässig 粗心 的\n\nBeispiel:\n\nHörtext\n\nA: Nach welcher Zeitdauer sollen die Eltern einschalten, wenn das Kind stundenlang am\nComputer sitzt und spielt?\n\nB: Das Interesse an Computerspiel lässt allmählich nach. Es kommt uns Erwachsenen\n\nmanchmal ganz lang vor, dass Kinder in Computerspiele versunken sind. Erst wenn das\nKind Monate lang keine sozialen Kontakte aufnimmt, sehe ich Anlass zur Besorgnis.\n\nA: ”如 果 孩 子 几 个 小 时 都 在 电脑 前 玩 游戏 ， 那 么 多 长 时 间 后 家 长 才 有 理由 干涉 呢 ?\n\nB: ”孩子 玩 电 脑 游戏 的 兴趣 会 逐渐 减弱 。 我 们 成 年 人 有 时 感 觉 他 们 玩 的 时 间 提 长 的 。 而 当\n孩子 们 几 个 月 都 不 进行 社交 的 时 候 ， 我 认为 才 有 理由 担心 。\n\n17\n"},{"pdf_page":6,"printed_page":18,"stage":[1],"source_text":"zu #7 -E 动 闻 所 纺 及 趴 扩展 间 汇\n\n18\n\n6.\n\nTs\n\ndie Nachricht, -en 消息 ， 新 闻 ”近义词 : die Botschaft, -en die Information, -en\n\ cheiden Vt. 区 别\n\n德 福 阅 读 题 示例 :\n\nText:\n\nDer deutsch-amerikanische Vergleich der Internetnutzung weist viele Ahnlichkeiten und\nwenige Abweichungen zwischen den Verhaltensweisen in beiden Lindern auf.\n\n通过 德 美 之 间 的 对 比 发 现 ， 这 两 个 国家 在 互联 网 应 用 行为 上 有 很 多 相似 性 ， 而 差别 较 少 。\n\nAufgabe: A, B oder C?\nWelches Ergebnis hat der deutsch-amerikanische Vergleich?\n\na. Das Verhalten im Internet unterscheidet sich viel.\n\nb. Der Vergleich weist die unterschiedliche Zahl der Internetnutzer in Deutschland und\nden USA auf.\n\nc. Es gibt kaum Unterschiede bei der Internetnutzung.\n\nLösung: c\n最 直接 的 词汇 转换 (Paraphrasen): wenige Abweichungen = kaum Unterschiede\n\nab/ziehen (zog ab, hat abgozogen) Vt. 扣除 der Abzug, ..e 扣 款 abzüglich + G.\n\nBeispiel:\n\nDie Abzüge der Bruttoeinkommen umfassen Steuern und die Beiträge der Sozialversicherung.\n收入 的 扣除 项 包括 税收 和 社会 保险 金 。\n"},{"pdf_page":15,"printed_page":27,"stage":[1],"source_text":"22 JAM Ba\n\nÜbungen zum Thema: das Studium\n1. Paraphrasen: 用 括号 中 的 动词 的 正确 形式 改写 句子 ， 注 意 动 词 的 正确 形式 :\na. Der Großteil der Studierenden kann das Studium zügig beenden. Manche müssen\n\ndoch aufgeben, weil sie an den Prüfungen gescheitert sind. (ab/brechen, ab/legen, ab/\nschließen )\n\nb. Klaus muss sich beeilen. Seine Aufenthaltserlaubnis gilt nur bis Juli. Er muss sich nun\nvöllig auf die Abschlussarbeit konzentrieren, um das Studium rechtzeitig abzuschließen.\nInzwischen sinkt sein Gewicht viel. Aber die Mühe lohnt sich. Seine Abschlussarbeit\nwurde gut bewertet. (ab/laufen, ab/nehmen, ab/schneiden)\n\nc. Seitdem sie das Kind hat, verhindern viele Schwierigkeiten ihr Studium. Ihr Stipendium\nreicht nicht mehr für den Lebensunterhalt aus, weil sie damit noch die Kinderkosten\ndecken muss. Sie hat die ganzen Möglichkeiten und Unmöglichkeiten überlegt und\nentschied sich endlich, mehr Geld von der Bank zu besorgen und die Kinderbetreuung\nder Tagesmutter zu überlassen. (ab/halten, ab/heben, Vorteile und Nachteile ab/wägen)\n\nd. Er ist gegen Studiengebühren und hat seine Meinung in der Motivation geschrieben.\nDeshalb wurde er von der Universität nicht aufgenommen. Er hat nie gedacht, dass es\nbei der Studienaufnahme auch auf die persönliche Meinung ankommt. Ihm wurde auch\nmitgeteilt, dass ein Student auch schon wegen Studiengebühren im letzten Semester\nexmatrikuliert wurde. (ab/hängen von, ab/lehnen, ab/melden, ab/sagen)\n\n2. Lückentext: 填 入 动词 的 正确 形式 。\n(ab/brechen, ab/geben, ab/lehnen, ab/melden, ab/schneiden, ab/schließen, ab/wägen)\nHans hatte Pech. Am Ende des letzten Semesters hat er die Prüfung nicht bestanden.\n\nGleichzeitig hat er im Praktikum auch schlecht , deshalb wollte er das\nStudium und sich von der Universität . Er hat seine\nBewerbungsunterlagen um eine Lehrstelle . Aber eines der Zeugnisse ist\nschon ungültig. Sein Antrag wurde von der Bildungsstätte . Er muss dann\n\ndurch Nebenjobs die Studiengebühren auftreiben, wenn er weiterstudieren will. Er ist ins\nLoch gestürzt. Jetzt muss er die Vor- und Nachteile des Weiterstudiums\nSchließlich möchte er das Studium doch\n\nLösung:\n1. Paraphrasen: 使 用 括号 中 的 动词 改写 句子 ， 注 意 动词 的 正确 形式 。\na. Der Großteil der Studierenden kann das Studium zügig abschließen. Manche müssen\ndas Studium doch abbrechen, weil sie die Prüfungen nicht abgelegt haben. (ab/brechen,\nab/legen, ab/schließen )\n\nb. Klaus muss sich beeilen. Seine Aufenthaltserlaubnis läuft im Juli ab. Er muss sich nun\n\n27\n"},{"pdf_page":16,"printed_page":28,"stage":[1],"source_text":"zw #7 -5 动 闻 万 统 及 其 扩展 间 汇\n\n28\n\n2.\n\nvöllig auf die Abschlussarbeit konzentrieren, um das Studium rechtzeitig abzuschließen.\nInzwischen nimmt er viel ab. Aber die Mühe lohnt sich. Er hat bei der Abschlussarbeit\ngut abgeschnitten. (ab/laufen, ab/nehmen, ab/schneiden)\n\nc. Seitdem sie das Kind hat, halten sie viele Schwierigkeiten vom Studium ab. Ihr\nStipendium reicht nicht mehr für den Lebensunterhalt aus, weil sie damit noch die\nKinderkosten decken muss. Sie hat die ganzen Vorteile und Nachteile abgewogen und\nentschied sich endlich, mehr Geld von der Bank abzuheben und die Kinderbetreuung\nder Tagesmutter zu überlassen. (ab/halten, ab/heben, Vorteile und Nachteile ab/wägen)\n\nd. Im Motivationsschrieben hat er die Studiengebühren abgelehnt. Deshalb wurde er von\nder Universität nicht aufgenommen. Er hat nie gedacht, dass die Studienaufnahme auch\nvon persönlicher Meinung abhängt. Ihm wurde auch mitgeteilt, dass sich ein Student\nauch schon wegen Studiengebühren im letzten Semester abgemeldet hat. (ab/hängen\nvon, ab/lehnen, ab/melden)\n\nLückentext:\n\nHans hatte Pech. Am Ende des letzten Semesters hat er die Prüfung nicht bestanden.\nGleichzeitig hat er im Praktikum auch schlecht abgeschnitten, deshalb wollte er das Studium\nabbrechen und sich von der Universität abmelden. Er hat seine Bewerbungsunterlagen\num eine Lehrstelle abgegeben. Aber eins von den Zeugnissen ist schon ungültig. Sein\nAntrag wurde von der Bildungsstätte abgelehnt. Er musste dann durch Nebenjobs die\nStudiengebühren auftreiben, wenn er weiterstudieren will. Er ist ins Loch gestürzt. Jetzt\nmuss er die Vor- und Nachteile des Weiterstudiums abwägen. Schließlich möchte er das\nStudium doch abschließen.\n\nAR an-\n\n基本 含义 :an- 作为 到\n\n前 级 有 儿 个 含义 :\n\nA. 表示 “接近 ， 挨 着 边 儿 ”。an/kommen (到达) ; an/sprechen (攀谈) ; an/nähren ( 接\n近 ) ; an/grenzen (接壤 )\n\nB. 表示 “开始 ”。an/brennen ( 点 燃 ) ; an/zahlen ( 第 一 期 分 期 付款 ,首付 )\n\nC. 表示 “增长 ”。an/bauen (种植 ， 加 建 ) ; an/reichen (使 增长 ); an/häufen (HR);\nan/fallen ( 逐渐 积累 )\n\nD. 表示 “动作 认真 和 迫切 性 ”。sich an/sehen (MA) ; an/fordern ( 迫切 要 求 )\n\n德 福 阅 读 题 示例 :\n\n„Achte auf deine Worte“ - damit wird aufmerksam gemacht, dass man mit jedem\n\nausgesprochenen Wort auch unfreiwillig ein Gefühl vermittelt. Diese emotionale Aufladung\n\nbeeinflusst sowohl den Zuhörer als auch den Sprecher. Aus einer umfangreichen Studie ergab\n"},{"pdf_page":17,"printed_page":29,"stage":[1,2],"source_text":"22 DM\n\nsich, dass Menschen genau angeben können, ob ein Wort der Jugendlichen ergriffen\nwerden?\nHERVHF FAUL ER A?\nüber/greifen (griff über, hat übergegriffen) Vi. 5%, &3£ auf A. über/greifen\n词汇 后 组 : -übergreifend: fächerübergreifend = interdisziplinär 跨 专业 的 ;\nsituationsiibergreifend 和 董 延 到 各 种 状况 的 ， 涉 及 各 种 情况 的\nBeispiel:\nRecherchieren ist eine fächerübergreifende Kompetenz, dabei geht es darum, wie man\nFachliteratur zusammenstellt.\n\n各 个 专业 都 适用 的 “检索 ”能 力 是 指 收集 专业 文献 的 能 力 。\n\nFamilienmitglieder pflegen engen oder weiten Körperkontakt unter allen Umständen.\n\n(4\n\nDas heißt, der Körperkontakt ist ein situationsübergreifendes Merkmal der Familie.\n家 庭 成 员 在 各 种 状况 下 都 保持 或 近 或 远 的 身体 接触 。 也 就 是 说 身体 接触 是 一 种 跨 情 境\n的 家 庭 特征 。\nSie hat gelernt, wie man stidteiibergreifende Restaurantkonzepte entwickelt und umsetzt.\n她 学 会 了 如 何 发 展 和 落实 跨 城 市 的 餐厅 规划 。\n(5) zu/greifen (griff zu, hat zugegriffen) Vt. 抓紧 ， 出 力 若干\nBeispiel:\nJedes Land sollte die durch das Internet gebrachten Chancen zugreifen.\n每 个 国家 都 应 抓 住 网 络 带 来 的 机 遇 。\n\n31\n"},{"pdf_page":20,"printed_page":32,"stage":[2],"source_text":"zw -# SUNMRANRERIL\n\n32\n\n10.\n\n11.\n\nÜbung: 用 以 下 词语 填空 。\n\n(Virenangriff, fächerübergreifend, etwas in den Griff bekommen, Maßnahmen ergreifen)\n\nAkademiker müssen heute Kompetenzen haben, z.B. PC- und Internetkenntnisse.\n\nMan die Orientierungslosigkeit in der Informationsfülle , wenn man\n\nmit Geschick recherchieren kann. Gleichzeitig muss man auch , um den PC vor\nzu schützen.\n\nLösung:\n\nAkademiker müssen heute fächerübergreifende Kompetenzen haben, z.B. PC- und\nInternetkenntnisse. Man bekommt die Orientierungslosigkeit in der Informationsfülle\nin den Griff, wenn man mit Geschick recherchieren kann. Gleichzeitig muss man auch\n\nMaßnahmen ergreifen, um den PC vor Virenangriffen zu schützen.\n\nan/klagen #2 der/die Angeklagte 被 告 ( 按 形容 词 变 词尾 )\n\nBeispiel:\n\nStaatsanwalt: Angeklagter, erklären Sie mir, in welcher Beziehung Sie zu Frau Müller\nstanden.\n\n检察 官 : 被 告 ， 请 解释 一 下 您 和 米 勒 夫人 是 什么 关系 。\n\nan/kommen (kam an, ist angekommen) Vi.\n(1) 到 达 : 这 个 词义 在 德 福 考 试 中 已 经 不 常见 ， 更 常见 的 是 下 面 两 个 同义词 :\nein/treffen (trifft ein, traf ein, ist eingetroffen) Vi.; gelangen Vi.\nBeispiel:\nDas Gedächtnis wird aktiviert, wenn die eintreffenden Signale einen sinnvollen\nEindruck zusammenfügen.\n当 到 达 的 信号 能 够 组 成 一 个 有 意义 的 印象 时 ， 记 忆 力 会 被 激活 。\nZiel war es zu erfassen, wie viele Sedimente und davon gebundene Nährstoffe aus\nflachen Gewässern in die Tiefsee gelangen.\n目的 是 要 了 解 有 多 少 浅水 区 的 沉积 物 及 其 中 的 营养 成 分 到 达 了 深海 。\n(2) auf A. an/kommen 依赖 于 ， 取 决 于\n近义词 : von D. abhängig sein, sich richten nach D.\n\n德 福 听 力 文章 示例 :\nFrage:\nWovon hängt die Schlafdauer ab?\n"},{"pdf_page":21,"printed_page":33,"stage":[2],"source_text":"22 DAN 训\n\nHörtext:\nEs gibt keine Faustregel dafür, wie lange man schlafen muss. Es kommt darauf an, dass man\nsich nach dem Schlaf erholt und am folgenden Tag fit fühlt. Während manche Leute nur\n\nvier Stunden Schlaf brauchen, erholen sich manche andere erst nach zehnstündigem Schlaf.\n\nLösung: Die Schlafdauer hängt davon ab, dass man sich nach dem Schlaf erholt und am\nfolgenden Tag fit fühlt.\n听力 问题 中 的 “von D. ab/hängen (依赖 于 ， 取 决 于 ) ”和 听力 原文 中 的 “auf A. an/\nkommen ( 取决 于 ) ”是 同义词 ， 用 同义词 来 提示 管 案 出 现 的 位 置 ， 答案 内 容 随后 出 现 。\n\n12. an/kündigen Vt. 宣告 ,通告\n。 构 词 讲解 :核心 词 干 : kund 表示 “熟悉 ， 知 道 ”\n。 构 词 如 下 : an/kiindigen Vt. = kund/tun Vt. 宣告\nsich erkundigen nach D. = sich informieren iiber A. 询问\n-kunde 表示 学 科 ， 如 : Heilkunde 医学 ，Naturkunde 博物 学\n。 kundig 内 行 的 ， 精 通 的 = erfahren = professionell = fachlich = versiert\nBeispiel:\nAuf der Pressemesse wurden nächste Forschungsschritte angekündigt.\n新 闻 发 布 会 上 通告 了 下 一 步 研究 动向 。\n\n13. an/legen Vt. 投 入, 投放， 安置\nBeispiel:\nGibt es im Menschengehirn einen biologisch angelegten Sinn fiir Syntax und Semantik,\nliegt im Nervensystem der Antrieb zum Sprechen?\n在 人 类 的 大 脑 中 是 否 存 在 对 于 句法 和 语义 的 先天 认 知 器 官 ?7 在 神经 系统 中 是 否 存在 语言\ndie Anlage, -n\n(1) 装置 : die Klimaanlage Z3\n(2) 资质 ， 天 资\n可 转换 的 近义词 : die Veranlagung, die Begabung, das Talent, die Vererbung, das Erbgut\n\n德 福 阅读 是 示例:\n\nLesetext:\n\nWenn Kinder drei Jahre alt sind, bewältigen sie schon Ausdrücke, die Relativsätze und\nPassivkonstruktionen enthalten. Dabei übertrifft ein dreijähriges Kind jeden Computer.\nAufgrund dieser Feststellung finden die Forscher heraus, dass die Sprachfähigkeit des\nMenschen zum Teil genetisch angelegt ist.\n\n33\n"},{"pdf_page":22,"printed_page":34,"stage":[2],"source_text":"m 2 -# SUNMRANRMIL\n\nAufgabe: Ja oder Nein?\nDas Ausdruckstalent hängt gewissermaßen von den Erbanlagen ab.\n\nLösung: Ja\n\n阅读 考点 分 析 :\n\n此 题 为 完全 的 词汇 转换 形式 。 阅 读 文章 中 的 原 句 “dass die Sprachfähigkeit des Menschen\nzum Teil genetisch angelegt ist” 中 的 “genetisch ( 基因 的 ) ”和 题目 中 的 “Erbanlagen\n( 遗传 资质 ) ”相对 应 ; zum Teil ( 部 分 地 ) 对 应 gewissermafien ( 在 一 定 程度 上 ) ;\nSprachfähigkeit ( 语言 能 力 ) 对 应 Ausdruckstalent ( 天 生 的 表达 能 力 ) 。\n\n14. an/locken Vt. 吸引\nBeispiel:\nDer gute Ruf der Elitenuniversität lockt die besten Bewerber an.\n这 所 精英 大 学 的 良好 声望 吸引 了 最 优秀 的 申请 人 。\n\n15. an/nehmen (nimmt an, nahm an, hat angenommen) Vt. 接受 die Annahme, -n\nIn Würzburg ist jüngst ein anonymes Papier aufgetaucht. Einem Prof. wird\nvorgeworfen, Geld von einem Promotionsvermittler angenommen zu haben.\n最 近 在 沃 英 堡 出 现 了 一 封 匿名 信 。 一 位 教授 被 指责 接受 了 一 位 博士 中 介 的 贿赂 。\n(2) 假设 ( 此 词义 在 考试 中 更 常见 ) die Annahme, -n 同义词 : die Hypothese, -n\nBeispiel:\nDie bisherigen Ergebnisse bestätigen größtenteils die vorher gemachten Annahmen.\n目前 取得 的 结果 证 实 了 之 前 所 做 的 大 部 分 假设 。\n\n16. an/passen Vt., 接受 ， 适 应 sich D. an/passen., 适应 某 事\ndie Anpassungsfähigkeit 适应 能 力\nBeispiel:\n德 福 阅 读 题 示例 :\nLesetext:\nDie Informationsgesellschaft wird große Anpassungsfähigkeit verlangen — vom Einzelnen\nund vom Staat. Die Druckerpresse brauchte Jahrhunderte, um ihre Macht zu entfalten,\nRadio und Fernsehen bedürfen immerhin mehrere Jahrzehnte. Die Infobahn beschleunigt\nnoch wesentlich. Ob am Arbeitsplatz, beim Konsum oder in den Medien: Die Umwandlung\nhat längst begonnen.\"\n\n4 Quelle: UF. Heuser, Am Bildschirm allein zu Haus, in: Die Zeit 43/1995, 5. 54\n\n34\n"},{"pdf_page":23,"printed_page":35,"stage":[2],"source_text":"22 DER m\n\nAufgabe: Ja oder Nein?\nDie Informationsgesellschaft muss sich dem Einzelnen und dem Staat anpassen.\n\nLösung: Nein\n\n题目 分 析 :\n\n原文 中 的 Anpassungsfihigkeit 与 题目 中 的 an/passen 做 了 简单 的 词汇 形式 的 转换 ， 由 名\n词 变 为 动词 ， 意 思 不 变 。 这 个 题目 迷惑 考生 的 地 方 是 动词 an/passen 这 个 词 的 不 同 主语 。von\njemandem etwas verlangen 是 指 要 求 某 和 人 做 某 事 。\n\n原文 中 说 “Die Informationsgesellschaft wird große Anpassungsfähigkeit verlangen—\nvom Einzelnen und vom Staat. 信息 社会 要 求 个 人 和 国家 都 要 有 很 强 的 适应 能 力 。 即 : 个\n人 和 国家 要 适应 信息 社会 ) 。 而 Aufgabe 中 说 : Die Informationsgesellschaft muss sich dem\nEinzelnen und dem Staat anpassen.( 信息 社会 必须 适应 个 人 和 国家 ) 。 和 原文 的 意思 相反 ，\n所 以 是 错误 的 。 这 是 德 福 阅 读 中 经 常 考 到 的 形式 偷 换 主语 。\n\n17. an/rechnen Vt. 折算 die Anrechnung\nBeispiel:\nDas Auslandssemester wird anerkannt, alle bisherigen Leistungen lassen sich anrechnen.\n国外 的 学 期 是 得 到 承认 的 ， 所 有 到 目前 取得 的 成 绩 都 可 折算 在 内 。\n\n18. an/regen Vt. 刺激 die Anregung, -en 主意， 点子， 想法\nBeispiel:\nWir legen großen Wert auf Anregungen und Kritiken unserer Webseitennutzer.\n我 们 非常 重视 网 页 使 用 者 的 建议 和 批评 。\n\n19. an/schaffen Vt. (成 套 ) 购买\nBeispiel:\nKauf eines Computers heißt noch nicht, dass man mit modernster Technik ausgestattet ist.\nUm mit der rasanten technischen Entwicklung Schritt zu halten, muss man fortlaufend neue\nSoft- und Hardware anschaffen.\n购买 一 台 计 算 机 并 不 意味 着 拥有 了 最 新 技术 装备 。 如 果 想 要 和 飞速 发 展 的 技术 保持 同\n步 ， 就 要 不 断 购买 新 的 软件 和 硬件 。\n\n20. an/schließen (schloss an, hat angeschlossen) Vt. 连接 der Anschluss, ..e 连接 ， 接 口\n近义词 : verbinden Vt.; zusammen/schließen Vt.; mit etwas (D.) gebunden sein\n3: Internet-Anschluss = Internet-Zugang 网 络 接口 Gas-Anschluss 煤气 管道 接口\n\nBeispiel:\nDieser kleine PC im Fernseher hat auch die Anschliisse an das Computernetz, ganz\n\n35\n"},{"pdf_page":24,"printed_page":36,"stage":[2], n des folgenden Tages\nvorzubreiten, wird als absolute Herausforderungen betrachtet.\n\n在 疲劳 的 工作 之 后 还 要 准备 明天 的 课程 ， 这 绝对 是 个 挑战 。\n\n27. an/treiben (trieb an, hat angetrieben) Vt. 推动 ， 促 进 der Antrieb, -e\n近义词 : an/kurbeln Vt.; fördern Vt.; vor/stoßen Vt.; an/stoßen Vt.\nBeispiel:\n\nDie Turbine wird durch Dampf angetrieben.\n涡轮 机 由 蒸汽 驱动 。\n\n28. an/werben (wirbt an, warb an, hat angeworben) Vt. 招募 die Anwerbung, -en\nBeispiel:\nDie Anwerbung der Gastarbeiter gilt als eine Lösung des durch Überalterung verursachten\nArbeitskräftemangels.\nRBEIHT IBÄABR HER LERNT RAN ART,\n\n29. an/zahlen Vt. (分 期 付款 ) 付 第 一 笔 款 die Anzahlung, -en 首付 款\nBeispiel:\nKönnen Sie bei der Bestellung 10 Euro als Anzahlung hinterlegen?\n在 预订 的 时 候 您 可 以 先 留 下 10 欧 元 预付 款 吗 ?\n\nUbungen:\n1. Paraphrasen: 用 括号 中 动词 的 正确 形式 改写 句子 :\n\na. Peter musste im Internet fiir einen Kurs einloggen. Aber wegen eines Virenangriffs\nfunktionierte sein PC nicht mehr. Er bat das Servicezentrum um Hilfe. Man teilte ihm\nmit, dass er sich eine neue Software besorgen muss. (an/fragen, sich an/melden, an/\nschaffen )\n\nb. In Stellenanzeigen internationaler Unternehmen werden Auslandserfahrungen häufig\nerwünscht, weil die Arbeitgeber interkulturelle Kompetenz als wichtige Qualifikation\nhoch schätzen. Darum sind die Auslandssemester für Studierende sehr attraktiv. Obwohl\nein Auslandssemester auch anspruchsvoll sein kann, will man doch dadurch bessere\n\nBerufschancen sichern. (an/sehen, an/locken, anstrengend)\n\n37\n"},{"pdf_page":26,"printed_page":38,"stage":[2],"source_text":"mm #7 -H DEWMRANRÜIL\n\n38\n\nc. Das Online-Studium ist schon breit akzeptiert worden. Viele Internetbenutzer sagen,\ndass sie durch das online Studium viel Zeit sparen. (an/geben)\nd. Im Seminar sind interaktive Kontakte zwischen Kommilitonen notwendig, wenn die\n\nLernaufgaben zunehmen. (an/fallen)\n\n2. Lesen Sie den folgenden Text und versuchen Sie, die unterstrichenen Stellen mit\n\nvorgegebenen Vokabeln zu ersetzen.\nan/sehen sichan/melden an/sprechen an/schaffen sich an/eignen\n\nPC werden global vernetzt. Jeder, der einen Internetanschluss hat, kann sich im Internet\neinloggen. Arbeitgeber betrachten PC- und Internetkenntnisse als Allgemeinqualifikation.\nNicht nur junge Leute sind aktiv bei Internetnutzung, auch ältere Menschen wollen\n\neinige Kenntnisse lernen. Im Internet lernen sie Freunde kennen und unterhalten sich\n\nviel. Jedenfalls soll man sich Antivirussoftware kaufen, um den PC vor Virenangriffen zu\n\nschützen.\n\nLösung:\n1. Paraphrasen: 用 括号 中 动词 的 正确 形式 改写 句子 :\n\na. Peter musste sich im Internet zu einem Kurs anmelden. Aber wegen eines Virenangriffs\nfunktioniert sein PC nicht mehr. Er fragte beim Servicezentrum an. Man teilte ihm mit,\ndass er eine neue Software anschaffen muss.\n\nb. In Stellenanzeigen internationaler Unternehmen werden Auslandserfahrungen häufig\nerwünscht, weil die Arbeitgeber interkulturelle Kompetenz als wichtige Qualifikation\nansehen. Darum locken Auslandssemester Studierende an. Obwohl ein Auslandssemester\nauch anstrengend sein kann, will man doch dadurch bessere Berufschancen sichern.\n\nc. Das Online-Studium ist schon bereit akzeptiert worden. Viele Internetbenutzer geben\nan, dass sie durch das online Studium viel Zeit sparen.\n\nd. Im Seminar sind interaktive Kontakte zwischen Kommilitonen notwendig, wenn mehr\nLernaufgaben anfallen.\n\n2. Lesen Sie den folgenden Text und versuchen Sie, die unterstrichenen Stellen mit\n\nvorgegebenen Vokabeln zu ersetzen.\nan/sehen sich an/melden an/sprechen an/schaffen sich an/eignen\n\nPC werden global vernetzt. Jeder, der einen Internetanschluss hat, kann sich im Internet\nanmelden. Arbeitgeber sehen PC- und Internetkenntnisse als Allgemeinqualifikation an.\nNicht nur junge Leute sind aktiv bei Internetnutzung, auch ältere Menschen wollen sich\n"},{"pdf_page":27,"printed_page":39,"stage":[2],"source_text":"22 DAN MM\n\neinige Kenntnisse aneignen. Im Internet sprechen sie Freunde an und unterhalten sic  题 示例 :\n\nLesetext:\n\nDie menschlichen Eingriffe in die Klimaverhältnisse können bis auf das Neolithikum vor\nsiebentausend Jahren zurückgeführt werden. Der Botaniker Frenzel von der Universität\nHohenheim führte das Beispiel aus, dass damals an der Donau etwa 15% der Urwälder gerodet\nund zu landwirtschaftlichen Zwecken genutzt wurden. Archäologische Funde zeigten, dass für\n10 Familien und 50 Rinder schon 50 Hektar Weide- oder Ackerland nötig waren.\n\nAufgabe:\nWann begannen die Menschen, Einfluss auf das Klima auszuüben?\nA. Als die Menschen in den Urwäldern wohnten.\n\n61\n"},{"pdf_page":50,"printed_page":62,"stage":[3],"source_text":"zu #2 -# SUNRRANRÜIL\n\n62\n\nB. Als die Menschen Landwirtschaft und Viehzucht betrieben.\nC. Als das Neolithikum begann.\n\nLösung: B\n\n问题 中 “Einfluss auf das Klima” 对 应 文章 里 的 “Eingriffe in die Klimaverhältnisse” .\nA 选项 的 内 容 与 原文 不 一 致 ， 原 文中 虽然 出 现 了 “Urwiilder ( 原始 森林 ) ”一 词 ， 但 并 无 与\nwohnen 相 关 的 内 容 ， 所 以 排除 A 选项 。C 选 项 内 容 原文 中 并 未 涉及 ， 因 为 原文 中 未 提 及 “das\nNeolithikum ( 新 石器 时 代 ) ”是 何 时 开始 的 。B 选 项 中 的 词汇 转换 有 两 对 : Landwirtschaft\n(农业 ) 对 应 Ackerland ( 农业 用 地 ) ， Rinder ( 牛 ) 对 应 Viehzucht (家畜 养殖 ) 。 所 以 B\n选项 正确 。\n\n可 分 前 纵 vor-\n\n基本 含义 : vor- 作为 动词 前 级 有 几 个 引申 含义 :\n\nA. 表示 空间 上 的 “向 前 ”。vor/treten ( 走 到 …… 前 面 ) , vor/stoßen ( 向 前 推进 ) ,\nvor/stellen ( 将 …… 放 置 于 前 )\n\nB. 表示 时 间 上 的 “提前 ， 预 先 ”。vor/sorgen ( 预防 ) ，vor/bereiten( 准备)\n\nC. 表示 “示范 ”。vor/zeichnen (绘画 示范 ) ，vor/lesen ( 朗读 )\n\n德 福 阅读 题 示例 :\n\nLesetext:\n\n„Ireten Sie jetzt vor den Schalter und geben Sie Ihre Passnummer an!“ Dies wird vielleicht\neines Tages nicht mehr passieren. Denn bei einer Online-Visumerteilung werden diese\nFormalitäten zu Hause erledigt.\n\nAufgabe: A, B oder C?\nMit welcher Aufforderung müssen zukünftige Visumantragsteller nicht mehr rechnen?\n\nA. „Stellen Sie sich vor den Schalter und sagen Sie Ihre Passnummer!“\nB. „Ireten Sie jetzt vor den Schalter und geben Sie Ihren Pass ab!“\n€. „Stellen Sie sich jetzt den Schalter  短文 记 单词 :\n\nBewerbung\n\nEin Hochschulabschluss verspricht bessere Berufschancen. Mit einem akademischen Titel wie\nBachelor, Master, oder dem traditionellen Diplom bzw. Magister kommt man bei Jobsuche\nleichter durch. Allerdings ist die Bewerbung um eine gute Stelle z.B. bei einem internationalen\nUnernehmen eine richtige Herausforderung für junge Absolventen. Die ganzen Unterlagen\nmüssen mit großer Sorgfalt vorbereitet werden. Gegebenfalls muss man die sämtlichen\nZeugnisse übersetzen und beglaubigen lassen. Zu den Unterlagen gehören alle Zeugnisse\nund Zertifikate, inklusive Sprachniveauzertifikate, Immatrikulationsbescheinigungen,\nVerleihungsurkunde, Praktikumauswertung, Gutachten von Professoren etc., die die\nQualifikationen des Bewerbers nachweisen. Die ganzen Unterlagen werden an die\nPersonalabteilung des Arbeitgebers geschickt. Die Personalabteilung überprüft die Unterlagen\nund selektiert die für sie interessanten Lebensläufe und Bewerbungsschreiben. Darauf folgt\nein Interview bei der Personalabteilung. Dabei wird der Bewerber neben Fachlichkeit noch\nin Hinsicht auf Auftreten, Flexibilität, Teamfähigkeit, Belastbarkeit etc. ausgewertet. Der\nBewerber kann sich über Arbeitszeit und -inhalte, sowie Vergütung informieren. Die Vergütung\nlässt sich gegebenenfalls je nach Qualifikationen des Bewerbers aushandeln.\n\nWas muss man bei der Jobsuche beachten? 找 工作 的 注意 事项 :\n\nArbeitsvertrag ab/schließen 签订 工作 合同 Versicherungen ab/schließen 办 理 保 险\ndie Kranken-, Arbeitslosen-, Rentenversicherung 医疗 、 失 业 、 养 老 保险\n\nder Fehltag, -e 缺勤 das Einkommen, - 收入\n\nder Lohn, ..e 工资 (bei der Hilfskraft / Aushilfe 打 零 工 )\n\nder Zeitlohn 计时 工资 der Akkordlohn 计件 工资\n\ndas Gehalt, .er 薪水 ( 注意 区 别 : der Gehalt, -e 内 容 ， 含 量 ， 成 分 )\n\ndie Feststelle, -n 固定 职位 die Vollbeschäftigung, -en 全 职工 作\ndas Nettogehalt 净 收 入 das Bruttogehalt 毛 收 入\n\n(Nettogehalt = Bruttogehalt minus Steuern / Abzüge)\n\ndie Steuer, -n # ( 注意 区 别 : das Steuer, - Haft, #£)\n\nder Abzug, ..e 扣 款 (z Hochschulabschluss\nPraktikumerfahrungen werden als großen Vorteil bei Arbeitssuche angesehen. Mit einem\nerfolgreichen Praktikum sind auch bessere Berufschancen verbunden, wenn die Praktikanten\nsich als professionell, aktiv, hochmotiviert, flexibel und belastbar bewähren kann. Aber lohnt\nsich überhaupt noch ein Praktikum nach dem Hochschulabschluss?\nDiese Frage kommt oft bei Hochschulabsolventen auf, die bei der Arbeitssuche eine Zeit\nlange keinen Erfolg erzielt haben. Da alle Absolventen jedoch gleich nach dem Abschluss\nvon der Familie unabhängig sein wollen, entscheiden sich viele zu einem Praktikum. Ideal\nist eine Praktikumstelle, bei der auch eigenes Fachwissen des Praktikanten erwünscht ist.\nUnternehmenskulturelle Kenntnisse, die der Praktikant erwirbt, sind auch hilfreich bei\nkünftiger Arbeitssuche.\nEin Praktikum nach dem Abschluss ist für Geisteswissenschaftsabsolventen jedoch nicht\nvielversprechend, weil man die Fachwissen wie Jura, Linguistik oder Psychologie nicht direkt in\ndie Arbeit integrieren kann.\n\n169\n"},{"pdf_page":158,"printed_page":170,"stage":[9],"source_text":"Zu #=# KERLE\n\n3.3 Bildung und Studium\n\ndie Erziehung 教育\n\nder Analphabetismus 文盲\n\nder Analphabet, -en 文盲 verlernen Vt. KA, KA\n\nerziehen (erzog, hat erzogen) Vt. 教育 der Erzieher, - 教育 者 , der Pädagoge, -n 教育 家\ndie Grundschule, -n 小 学 die Mittelschule, -n 中 学\n\ndie Sekundarschule, -n 高 中 die Hauptschule/ die Realschule, -n 普通 中 学\ndie Berufsschule, -n 职业 学 校 die Klasse, -n 年 级\n\ndas Klassenzimmer, - 教室 das Gymnasium, die Gymnasien Pl. 高 级 中 学\nder Gymnasiast, -en 高 级 中 学 学 生 das Abitur 中 学 毕业 考试\n\ndie Hochschulreife erwerben 获得 大 学 资格\nder Abiturient, -en 中 学 毕业 生 ( 有 上 大 学 的 资格 ) der Schulabgänger, - 中 学 毕业 生\n\nLehre machen 做 学 徒 der Lehrling, -e 学 徒 工\neine Lehrstelle finden 找 学 徒 的 位 置 die Gesellenpriifung 满 师 考试\ndie Meisterprüfung 师 伟 资格 考试 der Meister, - 师 伟\n\ndie Universität, -en 大 学 universitär 大 学 的\n\ndie Hochschule, -n 高 等 学 校 ， 大 学 die Fachhochschule  sind die\nStärken der FH. Natürlich wird auch dort geforscht, jedoch in enger Zusammenarbeit mit der\nIndustrie.\n\nMänner und Frauen haben auch unterschiedliche Vorliebe bei Fächerwahl. Während die Jungen\nsich deutlich mehr für Studiengänge wie Maschinenbau, Informatik, Mathematik und Physik\nentscheiden, neigen Mädchen zu Studiengängen wie Medizin, Pädagogik, Kunstgeschichte oder\n\nSprachwissenschaften. Auch Architektur, Theologie und Philosophie studieren mehr Männer\nals Frauen. Chemie ist der einzige naturwissenschaftliche Studiengang, der mehr Frauen als\n\nMänner fasziniert.\n\nAkademische Titel / akademischer Grad / akademische Abschlüsse: 大 学 学 历 文凭\ndas Diplom, -e 德国 的 工科 大 学 文凭 der Magister, - 德国 的 文科 项 士\n\n6 Textauszug aus Hochschuldeutsch, Band 2, Lektion 3: Bildung in Deutschland, Text B: Hochschulen in Deutschland. Beijing: 2009.\nHigher Education Press\n\n171\n"},{"pdf_page":160,"printed_page":172,"stage":[9],"source_text":"_ Bi\n\n172\n\nHEANLDCR\n\nder Bachelor, -s 学 士\n\nder Doktor 博士\n\nStudenten und Lehrkrifte 大 学 师 生 :\n\nder Studienbewerber, - 大 学 申请 人\n\nder Studienanfänger, - 大 学 新 生\n\nder / die Studierende, -n 大 学 在 读 学 生\n\nder Stipendiat, -en 奖学金 生\n\ndie Studenten in höheren Semestern 高 年 级 学 生\n\nder Hochschulabsolvent, -en 高 校 毕 业 生\n\nder Master, -s 项 士\n\nder Neuankömmling, -e 新 来 的 人\n\nder Student, -en 大 学 生\n\nder Diplomand, -en 攻读 Diplom 的 学 生\nder Praktikant, en #9 &\n\nder Kommilitone, -n 大 学 同学\n\nder Studienabgänger, - 大 学 毕业 生\n\nder Doktorand, -en / der Promovend, -en 在 读 博士 生 (Promotion, promovieren 攻读 博士 学 位 )\nstudentische Hilfskräfte Pl. 学 生 助 理 (Hiwi - Stelle 助理 的 工作 位 置 )\n\nder Kandidat, -en 候选 人 ; 考生\nder Priifer, - 考官\n\nder Tutor, -en 辅导 员\n\nder Laborant, -en 实验 员\n\nder Professor, -en 教授\n\nder Rektor, -en 校长\n\ndie Lehrveranstaltung, -en 教学 活动 :\ndie Vorlesung, -en 讲座 课 ， 大 课\n\ndas Proseminar, -e 基础 研讨 课\n\ndas Praktikum, die Praktika Pl. 实习\ndas Forum, die Foren Pl. 论坛\n\ndie Übung, -en 练习 课\n\ndie Priif n die Jugendlichen ihre Ausgaben viel\ngleichmäßiger. Die größte Ausgabe der Jugendlichen liegt\ngleichfalls bei Süßigkeiten, jedoch mit einem viel milderen Wert\nvon 25%.\n\nDie beiden Tiefwerte der Kindergruppe je für Lernmittel wie\nCDs und Softwaren (2%) sind bei Jugendlich auf 10% und 15%\ngestiegen. Für Hobbys und Spielzeuge geben die Jugendlich\netwa je 15% ihres Taschengeldes aus.\n\nZusammenfassend lassen sich unvernünftige Taschengeldausgaben\nbei Kindern feststellen.\n\n数据 图 标题\n\n数据 图 来 源\n\n数据 图 主题 Thema\n数据 总 数\n数据 清单 Kategorien\n总 述\n\n表示 对 比 ， 最 大 值\n具体 数值 表达\n\n对 比 (wihrend)\n\n最 低 值\n\n"},{"pdf_page":197,"printed_page":209,"stage":[11],"source_text":"41 BET 大\n\n上 面 的 数据 图 也 可 完整 描述 如 下 :\n\nAus dem vorliegenden Schaubild „Die Ausgaben von Taschengeld“ vom statistischen Bundesamt\ngeht der Konsumvergleich zwischen Kindern und Jugendlichen hervor. Die Ausgabenwege\nunterscheiden sich in 6 Waren, nämlich Süßigkeiten, Spielzeuge, Hobbys, CDs, Aussehen und\nSoftwaren. Die Beliebtheiten verändern sich deutlich mit dem zunehmenden Alter. Auffällig\nstehen Süßigkeiten bei Kindern an der Spitze mit 52%, danach folgen Spielzeuge mit 33%,\nerheblich mehr als CDs und Softwaren, die nur Schlusslichter bilden ( weniger als 2%). Im\nGegensatz dazu geben die Jugendlichen ihr Taschengeld gleichmäßiger aus. Der Anteil von\nSüßigkeiten beträgt 25%, mit geringer Überlegenheit als andere, z. B. der Anteil der CDs liegt\nnur bei 10%, weniger als die Hälfte der Süßigkeiten. Doch während Kinder Süßigkeiten und\nSpielzeuge bevorzugen, legen die Jugenglichen größeren Wert auf Lernmittel wie Softwaren\nund CDs (nämlich 2% zu 15%, 2% zu 10%). Es lassen sich unvernünftige Taschengeldausgaben\nbei Kindern feststellen.\n\n第 二 个 例子 是 一 个 表格 ,这 个 表格 描述 的 是 按照 时 间 变 化 的 趋势 ， 当 然 还 有 各 个 专业 之 间 数\n据 的 对 比 。\n\nBeispiel 2:\nDie Bewerber von verschiedenen Studienfächern in Köln\n\n1998 2002 2006 2010\nPhilosophie 128 133 190 230\nPädagogik 242 238 277 350\nMaschinenbau 582 587 543 520\nInformatik 1208 1690 1009 980\n\nDatenbeschreibung:\n\nDie Tabelle „Die Bewerber von verschiedenen Studienfächern in Köln“ liefert Informationen\nüber die sich verändernde Bewerberzahl der vier Fächer Philosophie, Pädagogik, Maschinenbau\nund Informatik zwischen 1998 und 2010. Die Daten basieren auf einer Datenerhebung von...im\nJahr.... Während die Zahl der angehenden Geisteswissenschaftler aufwärts geht (Philosophie\nvon 128 auf 230; Pädagogik von 242 auf 350), reduziert sich die Zahl der zukünftigen Ingenieure\nmit mal leichten (bei Maschinenbau) mal starken Schwankungen (bei Informatik). Auffälliger\nRückgang kommt beim Studienfach Informatik vor, wo die Bewerberzahl nach einem deutlichen\nZuwachs von 1998 bis 2002 (von 1208 auf 1690) wieder um fast 40% zurückgefallen ist (980 im\nJahr 2010). Immerhin ist der große Abstand der Bewerberzahl zwischen Naturwissenschaften\nund Geisteswissenschaften nicht zu übersehen: Der höchste Wert bei Informatik von 2010\nbeträgt fast das Fünffach des Wertes bei Philosophie (980 zu 230). Zusammenfassend kann man\nsagen, dass die Ingenieurfächer deutlich beliebter sind.\n\n209\n"},{"pdf_page":198,"printed_page":210,"stage":[11],"source_text":"Bu RUE CBERANSMNÄLER\n\n4,2 表示 观点 的 词汇\n\n德 福 考 试 中 写作 和 口语 题目 中 都 有 专门 的 观点 表达 的 要 求 。 其 中 口语 题 4、5、6、7 都 出 现 了\n这 样 的 要 求 ，Begriinden Sie Ihre Meinung。 虽 然 题 目 要 求 在 字面 上 一 致 ， 但 是 在 表达 形式 上 却\n大 不 相同 。 口 语 题 +、6 是 5 级 题 ， 这 两 个 题目 的 形式 是 在 研讨 课 上 的 正式 讨论 ， 更 像 报告 ， 所 以\n在 表达 观点 时 要 书面 化 一 些 ; 而 5 和 7 是 和 朋友 聊天 ， 给 出 建议 ， 是 非 正 式 场合 ， 如 果 用 了 书面 语\n来 答题 ， 就 会 出 现 可 笑 的 内 容 了 。\n\n而 写作 题目 有 一 种 题 型 是 给 出 两 个 观点 ， 然 后 就 一 个 主题 进行 论证 。 因 此 德 福 写 作 中 至 少 会\n出 现 3 次 表达 观点 的 地 方 ， 即 两 个 Fremdmeinungen 以 及 自己 的 观点 表达 。 按 照 德 福 写 作 不 能 重复\n的 要 求 ， 在 一 篇 文章 中 最 少 要 有 3 种 观点 表达 形式 ， 而 且 还 要 分 出 是 赞成 还 是 反对 。 下 面 分 类 列 出\n各 种 形式 ， 这 种 多 样 化 的 形式 不 仅 与 口语 写作 有 关 ， 也 是 阅读 和 听力 里 做 出 判断 的 基本 提示 点 。\n\ndie Meinung, -en 观点 die Auffasssung, -en 观点 ， 理 解\n\ndie Ansicht, -en 视角 ， 观 点 die Einstellung, -en 态度\n\nder Standpunkt, -e 立场 die Uberzeugung, -en 信念\n\ndie Position, -en 位 置 ， 立 场 die Stimme, -n 声音 (表示 “表达 自己 的 观点 ”)\n\ndie Rede, -n 说 法 ; die Rede und die Gegenrede 赞成 的 意见 和 反对 的 意见\n\n有 否定 意味 的 名 词 :\ndas Vorurteil, -e 成 见 ， 偏 见 das Klischee, -s 陈腐 思想\ndas Gerede Zi, ASK das Gerücht, -e 谣言\n\n口语 中 常见 的 表达 观点 的 名 型 :\n\n. Was hältst du von der Zeitschrift? Ich halte davon wenig.\n\n. Wie findest du meinen neuen Job? Ich finde / ich glaube, der Job ist sehr interessant.\n. Was würdest du an meiner Stelle tun? An deiner Stelle würde ich ...\n\nBun\n\n. Was glaubst du? Soll ich das Zimmer wählen?\n\n口语 中 表示 “赞同 ， 支 持 ”常用 的 名 型 :\nIch gebe dir recht.\n\nIch bin dafiir.\n\n. Ich bin der gleichen Meinung wie du.\n. Du hast recht.\n\n. Das ist eine tolle Idee.\n\nGanz meiner Meinung!\n\nnaurunn\n\n. Ich bin damit einverstanden.\n\n210\n"},{"pdf_page":199,"printed_page":211,"stage":[11],"source_text":"口语 中 表示 “反对 ”常用 的 名 型:\n\nZr Bl\n\n由 于 是 和 熟人 、 朋 友 聊 天 ， 在 表示 反对 的 时 候 ， 通 常 语气 上 都 比较 组 和， 不 太 出 现 强烈 批\n\n指责 的 话 。\n\n. Eigentlich ist das nicht mein Geschmack.\n\nMan muss ... ganz genau überlegen.\n\n. Ehrlich gesagt bin ich der anderen Meinung.\nIch muss zugeben, dass es nicht so praktisch ist.\n\n. Persönlich bin ich dagegen.\n\nSom-\n\n. Ich kann dir nur zum Teil recht geben.\n\n写作 中 及 正式 场合 表达 观点 的 名 型 :\n\n. Ich stehe auf dem Standpunkt, dass ...\n\n. Ich bin der Meinung / Auffassung / Ansicht, dass ...\n\n. Ich halte ... für ...\n\nMeine Position dazu ist, dass ...\n\n. Was meine Einstellung zu diesem Problem betrifft, ...\n. Ich habe darin dieselbe Einstellung wie die Befürworter, dass ...\n. Ich betrachte ... als ...\n\n. Ich plädiere für ...\n\n. Ich möchte den Standpunkt teilen, dass ...\n\n. Man kann nicht bestreiten, dass ...\n\n. Ich beurteile ... positiv / negativ.\n\nvyonmaurwnp\n\nSEES\n\n. Ich bin davon überzeugt / der Überzeugung, dass ...\n\n表示 We, Sch” a:\n\nbefürworten Vt. 赞同 der Befürworter, - / der Anhänger, - 支持 者\nunterstützen Vt. 支持 er akzep 可 以 用 在 这 个 名\n型 中 )\n\n3. reagieren auf etwas mit\nDie Eltern reagieren auf die Studiengebiihren mit Enttiuschung.\nDie Eltern reagieren enttäuscht auf die Studiengebühren.\n家 长 们 对 收 学 费 表示 失望 。\n\n4. beurteilen Vt.\n\nDie Regierung beurteilt die Studiengebühren positiv.\n政府 对 学 费 ( 政策 ) 的 评价 是 积极 的 。\n\n德 福 写 作 中 观点 改写 部 分 示例 :\n\nDas Schaubild zeigt die Erörterung über die Erwerbstätigkeiten neben dem Studium. Dazu\n\nsind zwei Meinungen umstritten. Die einen reagieren darauf mit Zweifel. Sie vertreten die\nAnsicht, dass die volle Konzentration auf das Studium den schnelleren Abschluss und bessere\n\nBerufschancen ermöglicht, Die anderen halten die Nebenjobs für vorteilhaft, denn die\n\nVerbindung zwischen Praxis und Theorie garantiert endlich die beruflichen Chancen nach dem\nStudium.\n\n其 中 画 线 部 分 是 表达 观点 的 句 型 。 这 是 德 福 写作 的 基本 要 求 之 一 。\n\n如 果 单单 从 改写 的 角度 来 讲 ， 我 们 是 不 需要 上 面 的 几 十 种 形式 的 。 但 是 上 面 讲 的 内 容 也 经 常\n出 现在 阅读 和 听力 当中 ， 其 至 出 现在 具体 的 论证 (Argumentation) 当 中 。\n\n德 福 听 力 题 示例 :\nAufgabe: richtig oder falsch?\nFrau Sturm lehnt die Studiengebiihren ab.\n\nHörtext:\n\nA: Frau Sturm, was ist Ihre Position zu der Einführung von Studiengebühren?\n\nB: Ja, im Hinblick auf den sozialen Aspekt, auf die Chancengleichheit, halte ich Studiengebühren\nfür eine große Gefahr. Solche Gebühren entmutigen doch die Familien, bei denen das Geld\n\nknapp ist und die auch nicht auf ein ausreichendes staatliches Stipendium zählen können.\n\nLösung: richtig\n这 段 听力 题目 考查 的 是 被 访谈 对 象 的 态度 ， 所 以 Paraphrasen 词 汇 转换 也 是 完全 用 的 表达\n观点 的 句 型 和 词汇 。 题 目 中 的 “ab/lehnen 拒绝 ”对 应 原文 中 的 “ich halte Studiengebühren\n\n213\n"},{"pdf_page":202,"printed_page":214,"stage":[11],"source_text":"N 530735\n\n进行 讨论 的 时 候 ， 每 个 人 不 同\n听 每 个 人 的 观点 (Einstellung oder Haltung) ， 这 些 内 容 都 和 上 面 罗 列 的 单词\n\n214\n\nBARZNZMNÄLRER\n\nfür eine große Gefahr ( 我 认为 收 学 费 是 一 个 巨大 的 危险 ) ”， 否 定 内 容 对 应 否定 内 容 ， 所 以\n答案 是 richtig。\n\n德 福 听 力 的 第 二 篇 一 般 是 一 篇 访谈 Interview， 其 中 涉及 到 的 访谈 对 象 为 2-3 人 ， 当 就 一 个 问题\n度 就 是 听力 出 题 的 判断 点 ， 所 以 德 福 听 力 特 别 要 求 考生 要 学 会\n相关 。\n\n请 看 下 面 德 福 口 语 5 级 题 论证 的 例子 :\n\nBeispiel 1:\n\nAufgabe 4:\n\nZur Zeit muss sich das Forschungsniveau in Deutschland erhöhen. In Ihrem pädagogischen\nSeminar diskutiert man über die Elitenhochschulen. Ein Kommilitone meint: Weil die\nElitenhochulen die Forschungsfortschritte vertreten, sollte der Staat ihnen die meisten\nInvestitionen erteilen, um die beste Forschung und Lehrkräfte zu finanzieren. Sie möchten dazu\n\nStellung nehmen. Die Diskussionsleiterin, Frau Prof. Rode, erteilt Ihnen das Wort.\n\nNehmen Sie Stellung zu dem Vorschlag, den Elitenhochschulen die meisten\nBildungsinvestitionen zu erteilen:\n\n— Wägen Sie die Vorteile und die Nachteile des Vorschlags ab.\n\n— Begründen Sie Ihre Zustimmung oder Ablehnung.\n\nBei unserer heutigen Diskussion vertreten manche Teilnehmer die Meinung, dass das\nForschungsniveau nur abhängig von Finanzmitteln an Elitenuniversitäten sei.\n\nGegen dieser Äußerung habe ich einiges einzuwenden. Fragwürdig erscheint mir zunächst\ndie Behauptung, dass Elitenhochschulen die Forschungsfortschritte verträten. Man kann\nnicht verneinen, dass einige Disziplinen in den Elitenhochschulen sehr fortschrittlich sind,\njedoch nicht alle Fachrichtungen an Elitenhochschulen sind vortrefflich. Die Bildungspolitiker\nbeurteilen die Studiengänge an deutschen Hochschulen vielfältig, d.h., jede Hochschule hat\neigene Stärken und Schwerpunkte. Wenn sich die staatlichen Finanzmittel der Behauptung\nzufolge nur auf einige Elitehochschulen konzentrieren würden, könnten die anderen\nUniversitäten vielleicht Finanznot und Niederlage in der Konkurrenz erleiden.\n\nDie Ansicht bestreiten auch viele Studenten in Deutschland. Wenn man die Forschung und\nLehrkräfte der Elitenhochschulen für den entscheidenden Faktor für Studienerfolg hält,\nwären der Fleiß und Leistungen der Studenten nur für sekundär erklärt. Diese aufgezwungene\nAbhängigkeit wollen die meisten Studenten nur ablehnen.\n\nIch plädiere jedenfalls dafür, dass Elitenhochschulen und andere Hochschulen gleich gefördert\nwerden sollten, denn das Wichtigste ist immer noch die Sicherung der gleichen Bildungschancen.\n"},{"pdf_page":203,"printed_page":215,"stage":[11],"source_text":"42 表示 觅 后 0D BE\n\n在 这 段 论证 中 ， 观 点 起 到 了 论据 的 作用 ， 很 多 的 来 自 政治 家 ， 来 自学 生 的 观点 都 成 为 作者 论\n证 的 有 利 论 据 。 因 此 观点 表达 的 句 型 可 以 作为 一 种 反对 形式 的 论证 方式 来 加 以 利用 。\n\nBeispiel 2\n\nAufgabe 4\n\nBei einer Diskussionsveranstaltung an Ihrer Hochschule geht es heute um die Reform von\nStudiengingen. Viele auslindische Studenten miissen vor der Immatrikulation lange Zeit\nDeutsch lernen. Diesen Zeitaufwand kann man vielleicht während der Studienzeit sparen.\nEinige haben vorgeschlagen, dass die Ausländer während der Vorlesungszeit Deutsch lernen,\ndann in den weiteren Lehrveranstaltungen Deutsch verbessern können. Sie möchten sich zu\n\ndiesem Vorschlag äußern. Die Diskussionsleiterin, Frau Tiele, erteilt Ihnen das Wort.\n\nNehmen Sie Stellung zu dem Vorschlag, Deutsch in der Vorlesungszeit zu lernen:\n— Wägen Sie die Vorteile und Nachteile dieses Vorschlags ab.\n— Begründen Sie Ihre Zustimmung oder Ablehnung.\n\nLösungsvorschlag:\n\nIm Allgemeinen ist das Deutschlernen in einem deutschen Umfeld zeitsparend. Wir dürfen\nauch nicht bestreiten, dass viele Ausländer Sprachtalent haben. Deutschlernen wird leichter,\nwenn sie Englisch beherrschen, denn viele Fachbegriffe sind ähnlich.\n\nAllerdings bezweifle ich, ob anspruchsvolle Lehrveranstaltungen wie Vorlesung ein\ngeeigneter Deutschkurs für die Ausländer sein können, und ob sich die Ausländer durch\nBesuch der Vorlesungen wirklich Deutschkurs ersparen können. Argumente der Befürworte\nfür Deutschlernen bei der Vorlesung erscheinen mir eher unüberzeugend. Ich bitte um\nAufmerksamkeit darauf, dass diese Methode durchaus negative Folge bringen kann. Die\nAusländer mit knappen Deutschkenntnissen können den Rotfaden der Vorlesung nicht\nbefolgen. Sie befinden sich keinesfalls in einem Lernprozess sondern eher in Verwirrung. Dabei\nlernen sie weder Deutsch noch welches Fachwissen.\n\nIn diesem Sinne möchte ich mich den Gegnern anschließen, dass man lieber Deutsch lernt und\nbeherrscht, bevor man die fachlichen Lehrveranstaltungen besucht. Ausländer sollten zuerst\neine Prüfung in Oberstufe ablegen, z.B. den TestDaF, erst dann können sie gerne Vorlesung\nbesuchen, was aus meiner Sicht viel sinnvoller ist.\n\n在 这 上 段 论证 中 ,我 们 看 到 表达 观点 的 名 型 起 着 连接 上 下 文 和 转折 的 作用 。 由 此 可 以 说 明 , 在\n学 习 表 达观 点 的 句 型 时 ， 不 要 只 是 把 这 些 当成 是 简单 的 一 句 开篇 的 套话 ， 这 些 内 容 可 以 在 德 式 表\n达 中 起 到 多 种 多 样 的 作用 。 我 们 缺乏 的 是 操练 和 语感 。\n\n215\n"},{"pdf_page":204,"printed_page":216,"stage":[11],"source_text":"mm ZUE BERENHMÄLER\n\n4.3 用 来 论证 的 词汇\n\n论证 部 分 是 难点 之 中 的 难点 ， 因 为 它 真 正 考查 了 考生 应 用 德语 的 能 力 。 要 想 了 解 论证 用 词 ，\n就 必须 首先 认 知 德 福 考 试 论证 部 分 的 要 求 。 德 福 论 证 的 要 求 包含 以 下 内 容 : 不 能 只 是 单反 面 论\n证 ,必须 从 多 个 角度 多 方面 论证 ， 也 就 是 所 有 德语 写作 中 都 要 求 的 Pro，Kontra。 它 或 者 表现\n为 优点 (Vorteile) 和 缺点 ( Nachteile ) 的 阐述 ,或 者 是 从 不 同 的 切入 点 ( mehrere Aspekte) 来\n展开 , 这 是 大 结构 的 论证 要 求 。 而 在 小 结构 的 论证 要 求 上 ， 也 就 是 说 在 一 个 论据 Argument 的 论\n证 过 程 中 必须 说 明 原 因 ， 也 就 是 要 “begriinden”。 按 照 这 样 的 常规 要 求 ， 有 两 类 词汇 是 论证\n的 必 备 词汇 。 一 类 是 表示 “positiv” 和 “negativ” 的 词汇 ， 从 这 点 上 来 讲 ， 很 多 这 类 基础 词汇\n已 经 学 过 了 ， 如 表示 “好 ”、“ 和 糟糠 ， 不 好 ”的 词汇 有 很 多 ， 所 以 在 考生 的 写作 中 教师 频繁 看\n\n到 的 句子 是 “Man kann ...” ; “das ist gut”; “das ist schlimm” 等 。 第 二 类 必 备 词汇 是 表\n示 原 因 的 词汇 ， 如 “weil, da” 从 旬 ，“denn, deshalb, deswegen”，“aufgrund, wegen” 等 形\n\n式 在 语法 学 习 中 应 该 都 已 经 学 过 了 。 但 是 单纯 上 述 的 表达 在 考试 中 并 不 能 得 到 好 的 评价 ， 原 因\n在 于 德 福 考 试 院 的 评分 标准 是 所 谓 的 “sachlich” 是 指 客观 表达 ， 客 观 表达 解释 起 来 很 简单 ， 就\n是 应 该 多 以 事件 描述 为 主 ， 而 少 用 人 做 主语 ， 所 以 我 们 看 到 德语 文章 中 各 种 形式 的 被 动态 表达\n大 行 其 道 ， 这 是 语法 层次 的 应 用 。 而 在 词汇 方面 就 需要 有 意识 地 运用 以 “事件 ”做 主语 的 单词\nT, 2:\n\nMehrsprachigkeit ist vorteilhaft bei der Bewerbung um internationale Arbeitsstellen.\n\n掌握 多 种 语言 有 利于 应 聘 国际 化 的 职位 。\n\n这 样 的 表达 可 能 就 比 下 面 的 形式 要 好 很 多 :\n\nWenn man einige Fremdsprachen beherrschen kann, kann man in internationalen Firmen arbeiten.\n\n这 种 句 型 是 作文 中 特别 常见 的 ， 不 但 句子 长 ， 而 且 表 达 上 没有 特色 和 亮点 。 因 此 这 一 节 的 重\n点 是 要 求 认 知 容易 得 高 分 的 词汇 和 句 型 ， 以 及 基本 的 论证 结构 形式 。\n\n一 个 论据 的 基本 结构 :\n\n写 一 个 完整 的 论据 (Argumentation) 有 以 下 结构 上 的 要 求 :\n1. Feststellung oder These: 观点 、 论 点\n\n2. Begründung: 说 明理 由\n\n3. Belege: 给 出 证 据 ， 一 般 是 给 出 实际 的 例子\n\n4. Schluss: 对 上 面 的 内 容 做 一 个 小 结\n\n表达 论点 并 没有 典型 的 句 型 或 词汇 ， 在 此 仅 举 几 例 ， 请 考生 注意 表达 方法 的 多 样 化 :\n1. Der Studienabschluss gilt als der Anfang der Karriere.\n\n大 学 毕业 被 看 作 是 事业 的 起 点 。\n2. Die Selbststindigkeit spielt eine entscheidende Rolle bei auslindischem Studium.\n自主 性 在 留学 生活 上 起 着 决定 性 的 作用 。\n\n216\n"},{"pdf_page":205,"printed_page":217,"stage":[11],"source_text":"4.3 RiPIINIDIL Be\n\n3. Die Idee der Ganztagschulen ist mit dem Konzept des gemeinschaftlichen Lernens eng\nverbunden.\n全 日 制 学 校 的 设想 与 共同 学 习 的 理念 紧密 相关 。\n\n4. Die Internetnutzung prägt einerseits die Schnelligkeit der Kommunikation andererseits die\nsoziale Isolation.\n网 络 使 用 一 方面 表现 为 快速 交流 ， 另 一 方面 显示 了 社会 的 隔膜 。\n\n5. Der Ausbau der Verkehrsnetze erfiillt die Wiinsche der PKW-Fahrer.\n交通 网 的 扩建 满足 了 私家 车 主 的 愿望 。\n\n6. Das Online-Studium empfiehlt sich besonders unter den Berufstitigen.\n对 于 有 工作 的 人 ， 网 络 学 习 值 得 推荐 。\n\nBegründung: 因果 关系 :\n\ndie Kausalität, -en 因果 关系 kausal 原因 的\n\nBeispiel:\n\nZwischen Studienleistungen und Selbstdisziplin besteht ein kausaler Zusammhang.\n在 学 习 成 绩 和 自律 之 间 存 在 因果 关系 。\n\n原因 一 结果\n\nverursachen Vt. 造成 (negativ) führen zu D. 导致\nhervor/bringen (brachte hervor, hat hervorgebracht) Vt. 引起 ， 带 来\nhervor/rufen (rief hervor, hat hervorgerufen) Vt. 引起 带 来\n\nBeispiel:\n\nDie virtuelle Kommunikation verursacht soziale Isolation.\n\n虚拟 网 上 交流 造成 社会 隔膜 。\n\n结果 原因\nverdanken Vt. 归 因 于 auf A. zurück/führen Vt. 归 因 于\n\nDas zügige Online-Studium ist auf die Verbreitung der Computer-Kenntnisse zurückzuführen.\n\n成 功 的 大 学 网 络 教育 归 因 于 计算 机 知识 的 普及 。\n\nSchluss 结语\n\nee 得 出 结论\n\nsich ergeben aus D. (ergibt, ergab, hat ergeben)\nvon D. aus/gehen (ging aus, ist ausgegangen)\n\nsich erschließen aus D.(erschloss, hat erschlossen)\nfolgern aus D.\n\n217\n"},{"pdf_page":206,"printed_page":218,"stage":[11],"source_text":"Zw #0\n\nBERZNAMNÄLER\n\n下 面 我 们 看 一 个 完整 的 论据 。\n\nDas online Studium empfiehlt sich besonders den Berufstitigen. In der ersten Linie ist ein\nonline Studium mit der eigenen Arbeit eng verbunden, weil die Berufstitigen stindig ihren\nWissenstand aktualisieren miissen. Dariiber hinaus gilt das online Studium mit seiner hohen\nFlexibilität auch noch als eine ideale Lösung für den Fall, dass man keine Zeit für regelmäßigen\nKursbesuch hat aber trotzdem was lernen will. Dass man durch ein online Studium zusätzliche\nQualifikationen erwerben kann, ist ohne weiteres der am breitesten anerkannte Vorteil. Ein\nAngestellter bei einem internationalen Unternehmen erzählt, dass er die Stelle bekommen hat,\nnachdem er durch ein online Studium seine Englischkenntnisse ausgebaut hat. Flexibilität,\nZugänglichkeit, Wiederholungsmöglichkeit und Zeittoleranz prägen das online Studium und\nmachen es für die Berufstätigen besonders attraktiv.\n\n我 们 还 可 以 通过 相应 的 形容 词 和 名 词 来 表达 是 在 论证 优点 还 是 缺点 ， 同 时 德语 中 有 很 多 动词\n\n本 身 可 以 很 直接 地 表示 优点 或 者 缺点 ， 如 果 用 动词 来 表示 会 起 到 更 直观 的 效果 。 下 面 列举 其 中 的\n一 部 分 :\n\n218\n\npositiv:\n\netwas in den Griff bekommen, etwas im Griff haben 对 …… 应 对 自如\ngewinnen (gewann, hat gewonnen) Vt. 赢得\n\ngarantieren Vt. 保证 , gewährleisten Vt. 保障\n\nermöglichen Vt. 让 …… 成 为 可 能\n\netwas gelingt jmdm. (gelang, ist gelungen) 成 功\n\nfördern Vt. 推动 ,促进\n\nvoran/treiben (trieb voran, hat vorangetrieben) Vt. 推动 ,促进\nfort/schreiten (schritt fort, ist fortgeschritten) Vi. 前 进\n\netwas erfolgt durch A. 通过 …… 得 以 实现\n\nsich bewähren 证 明 是 好 的\n\nBeispiel:\n\nDie erneubaren Energien haben sich als umweltfreundlich bewährt, denn die erneubare\nEnergienversorgung erfolgt ohne Emission oder Abwasser. Um die Klimaprobleme in ber Flüsse, Seen und Grundwasser geben\ngenug her. Die Energie der Sonne lässt jährlich an die 500.000 Kubikkilometer aus den\nGewässern der Erde verdunsten. Über 110.000 Kubikkilometer davon fallen als Niederschlag\nauf die Kontinente. Von dieser Menge verdunsten wieder knapp 70.000 Kubikkilometer. Und\ntrotzdem bleiben uns pro Jahr etwa 41.000 Kubikkilometer Süßwasser zurück, das durch Flüsse\noder als langsam fließendes Grundwasser in Richtung Meer strömt. Für jeden Menschen sind\ndas im Durchschnitt 6.600 Tonnen Wasser im Jahr. Doch selbst davon nutzen wir lediglich rund\nzehn Prozent.\n\n219\n"},{"pdf_page":208,"printed_page":220,"stage":[11],"source_text":"m 003\n\nBARANZMÄLER\n\n从 这 段 德语 文章 中 可 以 明显 看 到 ， 其 中 确实 每 句 话 都 有 过 渡 ， 而 且 绝对 不 会 让 人 觉得 重复 。\n\n如 果 我 们 能 从 德国 人 的 阅读 、 听 力 文章 中 学 会 过 渡 的 方式 ， 那么 写作 和 口语 表达 一 定 会 很 地 道 。\n下 面 就 来 看 看 德语 连接 过 渡 有 哪些 形式 。\n\n220\n\n1. 因果 关系 :\n因果 关系 除了 有 过 渡 的 作用 外 ， 更 重要 的 是 如 前 所 述 有 论证 的 作用 ， 所 以 因果 关系 的\n表达 在 德语 中 非常 多 样 化 ， 很 大 一 部 分 原因 是 为 了 表达 上 的 不 重复 。\ndarum, deshalb, deswegen, daher 因此 ; 表示 “原因 一 结果 ”\nBeispiel:\nBei den Studiengebühren müssen sich die Studenten zusätzliche Kosten leisten. Daher sind\nmanche gezwungen, den zweiten Job zu übernehmen.\n收 学 费 的 时 候 学 生 必 须 承担 额外 的 费用 ( 原因 )， 因 此 有 些 人 被 迫 要 打 第 二 份 工 ( 结果 )。\ndenn, nämlich, weil / da ..., zumal 因为 ; 表示 “结果 + 原因 ”\nBeispiel:\nOhne Energie gibt es keine zivilisatorische Entwicklung, denn Energie stellt die Grundlage\n\nunseres Alltags dar (weil Energie die Grundlage unseres Alltags darstellt).\n没有 能 源 就 没有 文明 的 发 展 ( 结果 ) ， 因 为 能 源 是 我 们 日 常生 活 的 基础 ( 原因 ) 。\n\n在 递 进 关系 的 句子 中 ,往往 递 进 关系 的 词汇 带 出 的 内 容 才 是 作者 真正 想 表达 的 ， 是 更\n重要 的 内 容 。 注 意 以 下 重点 表达 法 :\n\nhinzu kommen 此 外 ,而 且\n\nBeispiel:\n\nVor diesem Hintergrund muss dringend Mafinahmen zur Kontrolle der Energienutzung\ngetroffen werden. Hinzu kommt, dass die iiber Jahrmillionen angelegten Naturressourcen\nnicht unerschöpft sind.\n\n在 这 一 背景 下 必须 采取 措施 控制 能 源 使 用 。 此 外 自然 界 几 百 万 年 来 赋予 我 们 的
